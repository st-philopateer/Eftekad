<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="30%" stop-color="#DAA520" />
      <stop offset="50%" stop-color="#FDF5E6" />
      <stop offset="70%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#glow)" transform="translate(50, 50) scale(0.9)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Vertical bar -->
    <path d="M-5,-45 L5,-45 L5,-15 L-5,-15 Z" fill="url(#gold)" />
    <path d="M-5,15 L5,15 L5,45 L-5,45 Z" fill="url(#gold)" />
    
    <!-- Horizontal bar -->
    <path d="M-45,-5 L-15,-5 L-15,5 L-45,5 Z" fill="url(#gold)" />
    <path d="M15,-5 L45,-5 L45,5 L15,5 Z" fill="url(#gold)" />

    <!-- Ornate ends (trefoil style) -->
    <!-- Top -->
    <circle cx="-6" cy="-45" r="4" fill="url(#gold)"/>
    <circle cx="6" cy="-45" r="4" fill="url(#gold)"/>
    <circle cx="0" cy="-51" r="5" fill="url(#gold)"/>
    
    <!-- Bottom -->
    <circle cx="-6" cy="45" r="4" fill="url(#gold)"/>
    <circle cx="6" cy="45" r="4" fill="url(#gold)"/>
    <circle cx="0" cy="51" r="5" fill="url(#gold)"/>

    <!-- Left -->
    <circle cx="-45" cy="-6" r="4" fill="url(#gold)"/>
    <circle cx="-45" cy="6" r="4" fill="url(#gold)"/>
    <circle cx="-51" cy="0" r="5" fill="url(#gold)"/>

    <!-- Right -->
    <circle cx="45" cy="-6" r="4" fill="url(#gold)"/>
    <circle cx="45" cy="6" r="4" fill="url(#gold)"/>
    <circle cx="51" cy="0" r="5" fill="url(#gold)"/>
  </g>
</svg>
